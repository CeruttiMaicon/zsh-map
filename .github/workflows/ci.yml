name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orca:
    name: orca-setup selftest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Selftest orca-setup (compose por slot)
        run: bash scripts/orca-selftest.sh
